# Repository policy for obvious agents working in
# eleonorabjornberg/repo-market-model. Values detected from the GitHub
# repository settings on 2026-09-17.
defaultBranch: main
# All three merge methods are enabled in the repository settings; the
# project's own history integrates track branches with merge commits, so
# "merge" matches observed practice.
mergeMethod: merge
# True after the onboarding review: this repository integrates every change
# by hand (README: "every merge reviewed and integrated by hand"), and
# .obvious/ sits outside every ownership list, so a future agent pull
# request could rewrite these governance keys with no gate surfacing it.
# A human merge click is the backstop for that scenario.
requireHumanMerge: true
