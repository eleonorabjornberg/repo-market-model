[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-market-model"
version = "0.1.0"
description = "Probabilistic modeling of Treasury repo-market pressure"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Eleonora Bjornberg"}]
# The only declaration of the supported interpreter, and a range rather than a
# pin. Published documents state it and tests/test_docs_freshness.py refuses any
# that states another; that guard now evaluates this string as a PEP 440
# specifier, so the declaration can say what is supported instead of whatever a
# substring search could match.
#
# Decided by the human on 30 Sep 2026 (#29, #53): 3.11 only. Every environment
# that runs or scores this project is the rmm cloud environment, on 3.11; 3.9
# and 3.10 had no user left, and dropping them let the ml extra move to current
# releases (#55). 3.11.15 runs the whole suite green. 3.12 and 3.13 import and
# run everything, and fail the Milestone A reproduction: 3.12's built-in sum()
# compensates float rounding, so every published figure moves in its last
# digits and the exact comparison refuses it. The ceiling is that finding.
# Raising it means deciding whether a record reproduces to the bit or to a
# stated tolerance -- not a version bump.
requires-python = ">=3.11,<3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

# Optional, and for src/repo_model/ml.py only. Decided by the human on 10 Sep
# 2026: phase 2's candidate models (gradient-boosted conditional quantiles) need
# them. Everything else stays standard-library only, so every published record
# reproduces with no install; tests/test_dependency_boundary.py holds that line.
# The lower bounds are the latest releases that support CPython 3.11, as of
# 1 Oct 2026 (#55, on the human's ruling to use the best available versions):
# numpy 2.4.6 (numpy 2.5 requires 3.12) and scikit-learn 1.9.1. A gbm figure
# moves with scikit-learn's version, so the floor keeps every fit on the
# versions the suite and the re-score (#27) were measured on, and the ceiling
# refuses the next major version, whose API is not measured here. CI's ml job
# pins exactly these two, and the rmm environment's /opt/rmm-venv is to pin the
# same, by its setup script, which lives outside this repository.
[project.optional-dependencies]
ml = ["numpy>=2.4.6,<3", "scikit-learn>=1.9.1,<2"]

[project.urls]
Repository = "https://github.com/eleonorabjornberg/repo-market-model"

[project.scripts]
repo-model = "repo_model.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
