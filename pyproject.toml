[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-market-model"
version = "0.1.0"
description = "Probabilistic modeling of Treasury repo-market pressure"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Eleonora Bjornberg"}]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/eleonorabjornberg/repo-market-model"

[project.scripts]
repo-model = "repo_model.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
