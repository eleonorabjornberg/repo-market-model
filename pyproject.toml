[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-market-model"
version = "0.1.0"
description = "Probabilistic modeling of Treasury repo-market pressure"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Eleonora Bjornberg"}]
# The only declaration of the supported interpreter, and a range rather than a
# pin. Published documents state it and tests/test_docs_freshness.py refuses any
# that states another; that guard now evaluates this string as a PEP 440
# specifier, so the declaration can say what is supported instead of whatever a
# substring search could match.
#
# Measured, not asserted. 3.9.23, 3.10 and 3.11.15 each run the whole suite
# green (10 Sep, after 9a38a0c repaired the mappingproxy default that made 3.11
# refuse baseline.py at import). 3.12 and 3.13 import and run everything, and
# fail the Milestone A reproduction: 3.12's built-in sum() compensates float
# rounding, so every published figure moves in its last digits and the exact
# comparison refuses it. The ceiling is that finding. Raising it means deciding
# whether a record reproduces to the bit or to a stated tolerance -- not a
# version bump.
requires-python = ">=3.9,<3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

# Optional, and for src/repo_model/ml.py only. Decided by the human on 10 Sep
# 2026: phase 2's candidate models (gradient-boosted conditional quantiles) need
# them. Everything else stays standard-library only, so every published record
# reproduces with no install; tests/test_dependency_boundary.py holds that line.
# The upper bounds are the last releases that still support Python 3.9.
[project.optional-dependencies]
ml = ["numpy>=1.24,<2.1", "scikit-learn>=1.4,<1.7"]

[project.urls]
Repository = "https://github.com/eleonorabjornberg/repo-market-model"

[project.scripts]
repo-model = "repo_model.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
