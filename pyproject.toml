[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-market-model"
version = "0.1.0"
description = "Probabilistic modeling of Treasury repo-market pressure"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Eleonora Bjornberg"}]
# The only declaration of the supported interpreter, and a range rather than a
# pin. Published documents state it and tests/test_docs_freshness.py refuses any
# that states another; that guard now evaluates this string as a PEP 440
# specifier, so the declaration can say what is supported instead of whatever a
# substring search could match.
#
# Measured, not asserted. 3.9 and 3.10 each run the whole suite green. 3.11
# rejects the package at import: baseline.py carries a mappingproxy default on a
# frozen dataclass field, which 3.11 refuses as a mutable default. Raise the
# ceiling when that is repaired, and not before -- the ceiling is the finding.
requires-python = ">=3.9,<3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Repository = "https://github.com/eleonorabjornberg/repo-market-model"

[project.scripts]
repo-model = "repo_model.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
