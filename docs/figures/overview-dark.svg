<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" width="800" height="388" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-label="What the model reads and what it answers: four groups of public data -- the price of overnight cash, spare cash in the system, days when a lot of cash is needed at once, and where cash can park instead -- flow into what is known at 4 pm the day before, and then into the chance that tomorrow's rate is at least 5 basis points above what the Fed pays on reserves">
<rect width="800" height="388" fill="#1a1a19"/>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L7,4 L0,7 z" fill="#c3c2b7"/></marker></defs>
<text x="8" y="21" font-size="13" fill="#ffffff" font-weight="600">What the model reads, and what it answers</text>
<text x="8" y="38" font-size="11" fill="#c3c2b7">Four groups of public data, each read as it stood at 4 pm on the day before the day being forecast.</text>
<rect x="8" y="58" width="344" height="64" rx="4" fill="#3987e5" fill-opacity="0.08" stroke="#383835" stroke-width="1"/>
<text x="20" y="77" font-size="11" fill="#ffffff" font-weight="600">The price of overnight cash</text>
<text x="20" y="94" font-size="10" fill="#c3c2b7">SOFR, TGCR, BGCR</text>
<text x="20" y="110" font-size="10" fill="#898781">why: what borrowing cash against Treasuries costs right now</text>
<path d="M352,90.0 C382,90.0 370,169.3 398,169.3" fill="none" stroke="#c3c2b7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="8" y="134" width="344" height="64" rx="4" fill="#3987e5" fill-opacity="0.08" stroke="#383835" stroke-width="1"/>
<text x="20" y="153" font-size="11" fill="#ffffff" font-weight="600">Spare cash in the system</text>
<text x="20" y="170" font-size="10" fill="#c3c2b7">reserves, TGA, ON RRP (planned)</text>
<text x="20" y="186" font-size="10" fill="#898781">why: the less there is, the harder borrowers bid for it</text>
<path d="M352,166.0 C382,166.0 370,195.9 398,195.9" fill="none" stroke="#c3c2b7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="8" y="210" width="344" height="64" rx="4" fill="#3987e5" fill-opacity="0.08" stroke="#383835" stroke-width="1"/>
<text x="20" y="229" font-size="11" fill="#ffffff" font-weight="600">Days when a lot of cash is needed at once</text>
<text x="20" y="246" font-size="10" fill="#c3c2b7">month-, quarter- and tax dates; Treasury settlements</text>
<text x="20" y="262" font-size="10" fill="#898781">why: known in advance: cash leaves the system on those days</text>
<path d="M352,242.0 C382,242.0 370,222.5 398,222.5" fill="none" stroke="#c3c2b7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="8" y="286" width="344" height="64" rx="4" fill="#3987e5" fill-opacity="0.08" stroke="#383835" stroke-width="1"/>
<text x="20" y="305" font-size="11" fill="#ffffff" font-weight="600">Where cash can park instead</text>
<text x="20" y="322" font-size="10" fill="#c3c2b7">Treasury bills</text>
<text x="20" y="338" font-size="10" fill="#898781">why: when bills pay more, lenders move cash out of repo</text>
<path d="M352,318.0 C382,318.0 370,249.1 398,249.1" fill="none" stroke="#c3c2b7" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="400" y="150" width="184" height="124" rx="4" fill="none" stroke="#ffffff" stroke-width="1.6"/>
<text x="492.0" y="180" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">What we know</text>
<text x="492.0" y="196" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">at 4 pm the day before</text>
<text x="492.0" y="222" font-size="10" fill="#898781" text-anchor="middle">each input at its latest</text>
<text x="492.0" y="236" font-size="10" fill="#898781" text-anchor="middle">published value; scheduled</text>
<text x="492.0" y="250" font-size="10" fill="#898781" text-anchor="middle">days read for tomorrow</text>
<line x1="584" y1="212.0" x2="618" y2="212.0" stroke="#c3c2b7" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="620" y="136" width="172" height="152" rx="4" fill="#e5703f" fill-opacity="0.12" stroke="#e5703f" stroke-width="1.6"/>
<text x="706.0" y="170" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">The chance tomorrow's</text>
<text x="706.0" y="187" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">rate is ≥ 5 bp above</text>
<text x="706.0" y="204" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">what the Fed pays</text>
<text x="706.0" y="221" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">on reserves</text>
<text x="706.0" y="268" font-size="10" fill="#c3c2b7" text-anchor="middle">P(SOFR − IORB ≥ +5 bp)</text>
<text x="8" y="376" font-size="10" fill="#898781">ON RRP is planned, not yet in the panel. Settlements are read for tomorrow once their auction-time declaration lands.</text>
</svg>
