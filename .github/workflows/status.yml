name: status

# docs/status.json is the only machine-readable claim this repository publishes
# about itself, and the portfolio site reads it. It is generated, never edited,
# by scripts/emit_status.py.
#
# It is regenerated inside the pull request that changes its inputs (PLAN.md,
# the top-level run records, metadata/events.json, pyproject.toml), and this
# job checks that it was. It used to be regenerated by a bot commit on main
# after every merge; that left every open branch one commit behind, and
# directive 05 (#50) retired it. Nothing here writes to the repository.
#
# Nothing installs here: the emitter is standard library only, by contract, the
# same as the test suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emit:
    # The name is kept from when this job committed the file, because a
    # branch rule or a reader of check runs may name it.
    name: publish docs/status.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The file is stamped with the latest commit that changed an input, which
      # needs the history, not a depth-1 clone.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # Fails when the committed file is not what the inputs produce. That also
      # catches PLAN.md becoming unpublishable (a phase heading the parser will
      # not guess at, a published phase with no exit criterion).
      - name: Check docs/status.json agrees with its inputs
        run: python3 scripts/emit_status.py --check

      - name: Did this push change it?
        id: changed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
              && git diff --quiet "${BEFORE}" HEAD -- docs/status.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The site also syncs on a daily schedule, so a missing or expired token
      # delays the update by hours rather than losing it. That is why this step
      # warns instead of failing.
      - name: Tell the site
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning title=No dispatch token::SITE_DISPATCH_TOKEN is not set. The site will pick this up on its daily schedule instead of immediately."
            exit 0
          fi
          gh api --method POST \
            repos/eleonorabjornberg/eleonorabjornberg.com/dispatches \
            -f event_type=model-status
          echo "Dispatched model-status to the site repository."
