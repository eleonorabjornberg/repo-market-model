name: pages

# Deploys site/ to GitHub Pages on every push to main (directive 06). The page is
# built here, on main, and never committed (#928): it, its data (docs/visual/data/) and the
# assembled research log (docs/research/log.md) are gitignored, because every merge changed
# all three and so conflicted every open pull request that carried its own copy. This job
# assembles the log from docs/research/log/, then builds the page and its data stamped with
# the latest commit that changed an input (`emit_visual.py --stamp`, #789), in its own
# checkout, and commits nothing. A pull request changes the inputs only; tests.yml refuses one
# that carries a built file (scripts/check_built_outputs.py). Nothing is installed here.
#
# The repository's Pages source must be set to "GitHub Actions" once, in Settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy site/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The stamp is the latest commit that changed an input, which needs the history.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # The log page is built from the entry files; the results page reads the entries, not log.md.
      - name: Assemble the research log
        run: python3 -B scripts/check_research_log.py assemble

      - name: Build the page and its data, stamped with the latest input commit
        run: python3 -B scripts/emit_visual.py --stamp

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
