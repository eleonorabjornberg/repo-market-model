name: pages

# Deploys site/ to GitHub Pages on every push to main (directive 06). The page is
# generated by scripts/emit_visual.py and committed; tests.yml (tests/test_visual.py)
# refuses a stale one, so this job only publishes what main already carries. The committed
# page carries no commit stamp (#789): this job stamps the copy it deploys with the latest
# commit that changed an input (`emit_visual.py --stamp`), in its own checkout, and commits
# nothing. Nothing is installed here.
#
# The repository's Pages source must be set to "GitHub Actions" once, in Settings.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy site/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The stamp is the latest commit that changed an input, which needs the history.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Stamp the page with the latest input commit
        run: python3 -B scripts/emit_visual.py --stamp

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
