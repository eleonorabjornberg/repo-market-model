name: directive-loop

# Implement -> review -> merge, one queued directive at a time. The queue is the issue in vars.QUEUE_ISSUE.
# Governed by "Delegated review" in docs/decisions/workflow.md.
on:
  pull_request:
    types: [opened, ready_for_review, closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [next, review, fix]
        default: next
      pr:
        type: string
        default: ""
      attempt:
        type: string
        default: "1"

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

env:
  REPO: ${{ github.repository }}
  QUEUE: ${{ vars.QUEUE_ISSUE }}

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.r.outputs.mode }}
      pr: ${{ steps.r.outputs.pr }}
      attempt: ${{ steps.r.outputs.attempt }}
    steps:
      - id: r
        env:
          EV: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          PRN: ${{ github.event.pull_request.number }}
          IN_MODE: ${{ inputs.mode }}
          IN_PR: ${{ inputs.pr }}
          IN_ATT: ${{ inputs.attempt }}
        run: |
          mode=none; pr=""; att=1
          if [ "$EV" = workflow_dispatch ]; then mode="$IN_MODE"; pr="$IN_PR"; att="${IN_ATT:-1}"
          elif [ "$ACTION" = closed ]; then [ "$MERGED" = true ] && mode=next || true
          else mode=review; pr="$PRN"; fi
          { echo "mode=$mode"; echo "pr=$pr"; echo "attempt=$att"; } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- implement
  next:
    needs: route
    if: needs.route.outputs.mode == 'next'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: loop-next
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.LOOP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.LOOP_TOKEN }}

      - name: Pick the next directive
        id: pick
        run: |
          set -euo pipefail
          stop() { echo "$1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          hold() { gh issue edit "$QUEUE" -R "$REPO" --add-label hold >/dev/null; gh issue comment "$QUEUE" -R "$REPO" -b "Loop paused: $1" >/dev/null; stop "$1"; }
          [ -n "$QUEUE" ] || stop "vars.QUEUE_ISSUE is not set."
          q=$(gh issue view "$QUEUE" -R "$REPO" --json state,labels,body)
          [ "$(jq -r .state <<<"$q")" = OPEN ] || stop "Queue closed."
          jq -e '.labels[] | select(.name == "hold")' <<<"$q" >/dev/null && stop "Queue on hold."
          sha=$(git rev-parse HEAD); id=""
          for i in $(seq 20); do
            id=$(gh run list -R "$REPO" --workflow tests.yml --commit "$sha" --limit 1 --json databaseId -q '.[0].databaseId // empty')
            [ -n "$id" ] && break; sleep 30
          done
          if [ -n "$id" ]; then gh run watch "$id" -R "$REPO" --exit-status --interval 60 >/dev/null || hold "CI is red on main at $sha."; fi
          next=""
          for n in $(jq -r .body <<<"$q" | grep -oE '^[-*] #[0-9]+' | tr -dc '0-9\n'); do
            [ "$(gh issue view "$n" -R "$REPO" --json state -q .state)" = CLOSED ] && continue
            next=$n; break
          done
          if [ -z "$next" ]; then
            gh issue comment "$QUEUE" -R "$REPO" -b "Queue complete. Delegated review has ended; merging returns to Eleonora." >/dev/null
            gh issue close "$QUEUE" -R "$REPO" >/dev/null; stop "Queue complete."
          fi
          labels=",$(gh issue view "$next" -R "$REPO" --json labels -q '[.labels[].name] | join(",")'),"
          case "$labels" in *,hold,*|*,needs-eleonora,*) hold "#$next is waiting on Eleonora." ;; esac
          open=$(gh pr list -R "$REPO" --state open --limit 100 --json number,body \
                 | jq -r --arg n "$next" '.[] | select(.body | test("(?i)closes #" + $n + "\\b")) | .number' | head -1)
          if [ -n "$open" ]; then
            gh workflow run directive-loop.yml -R "$REPO" -f mode=review -f pr="$open" -f attempt=1
            stop "#$next has PR #$open; review dispatched."
          fi
          case "$labels" in *,in-progress,*) stop "#$next is being worked." ;; esac
          model=claude-opus-5-5; case "$labels" in *,docs,*) model=claude-sonnet-5-5 ;; esac
          gh issue edit "$next" -R "$REPO" --add-label in-progress >/dev/null
          { echo "run=true"; echo "issue=$next"; echo "model=$model"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.run == 'true'
        with:
          python-version: "3.10"
      - if: steps.pick.outputs.run == 'true'
        run: python -m pip install --quiet "numpy==2.0.2" "scikit-learn==1.6.1"

      - uses: anthropics/claude-code-action@v1
        if: steps.pick.outputs.run == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.LOOP_TOKEN }}
          claude_args: |
            --model ${{ steps.pick.outputs.model }}
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob"
          prompt: |
            Work issue #${{ steps.pick.outputs.issue }} in ${{ github.repository }}. Read CLAUDE.md first, then docs/pivot/next-session.md.

            THIS IS A HEADLESS RUN in a GitHub Actions runner. The session ends when you stop talking. Never background a command and end your turn; run the full suite and every mutation in the foreground. Finish in this one run: branch from origin/main, commit, `git push origin HEAD`, and open one pull request with `gh pr create`. Never push to main and never merge.

            The PR body must contain the line "Closes #${{ steps.pick.outputs.issue }}". If you cannot finish, open the PR as a draft saying what is done and what is not.

            Environment: `python` on PATH is 3.10 with numpy 2.0.2 and scikit-learn 1.6.1. Use it in place of /opt/rmm-venv and say so in the PR.

            Judgement calls are Eleonora's: open a needs-eleonora issue or put a marked question in the PR; do not settle them in code. A finding outside this directive becomes a `finding` issue. Anything in the issue that turns out to be wrong is a finding, and reporting it is the job.

      - if: failure() && steps.pick.outputs.run == 'true'
        run: |
          gh issue edit "$QUEUE" -R "$REPO" --add-label hold >/dev/null
          gh issue comment "$QUEUE" -R "$REPO" -b "Loop paused: the run for #${{ steps.pick.outputs.issue }} failed or timed out: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # ---------------------------------------------------------------- review
  review:
    needs: route
    if: needs.route.outputs.mode == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: loop-review-${{ needs.route.outputs.pr }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.LOOP_TOKEN }}
      PR: ${{ needs.route.outputs.pr }}
      ATT: ${{ needs.route.outputs.attempt }}
    steps:
      - name: Is this the loop's PR?
        id: gate
        run: |
          set -euo pipefail
          stop() { echo "$1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          p=$(gh pr view "$PR" -R "$REPO" --json state,isDraft,body,headRefName)
          [ "$(jq -r .state <<<"$p")" = OPEN ] || stop "PR #$PR is not open."
          issue=$(jq -r .body <<<"$p" | grep -oiE 'closes #[0-9]+' | head -1 | tr -dc '0-9' || true)
          [ -n "$issue" ] || stop "PR #$PR closes no issue."
          queued=$(gh issue view "$QUEUE" -R "$REPO" --json body -q .body | grep -oE '^[-*] #[0-9]+' | tr -dc '0-9\n' || true)
          grep -qx "$issue" <<<"$queued" || stop "#$issue is not in the queue."
          { echo "run=true"; echo "issue=$issue"; echo "draft=$(jq -r .isDraft <<<"$p")"; echo "head=$(jq -r .headRefName <<<"$p")"; } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ steps.gate.outputs.head }}
          fetch-depth: 0

      - name: Wait for CI
        id: ci
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.draft != 'true'
        run: |
          sleep 90
          set +e
          out=$(gh pr checks "$PR" -R "$REPO" --watch --interval 60 2>&1); rc=$?
          set -e
          if grep -qi "no checks reported" <<<"$out"; then s=missing; elif [ $rc -eq 0 ]; then s=green; else s=red; fi
          echo "state=$s" >> "$GITHUB_OUTPUT"; echo "$out" | tail -20

      - uses: actions/setup-python@v5
        if: steps.ci.outputs.state == 'green'
        with:
          python-version: "3.10"
      - if: steps.ci.outputs.state == 'green'
        run: python -m pip install --quiet "numpy==2.0.2" "scikit-learn==1.6.1"

      - name: Review session (read-only token)
        if: steps.ci.outputs.state == 'green'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash,Read,Grep,Glob,Write"
          prompt: |
            You are the review session for PR #${{ env.PR }} in ${{ github.repository }}, which closes directive issue #${{ steps.gate.outputs.issue }}. You did not write it; review it as Eleonora would. The PR branch is checked out. Your GitHub token is read-only: do not edit tracked files, commit, push, merge or label.

            Read CLAUDE.md, docs/decisions/workflow.md (including "Delegated review", which is your mandate), the issue (`gh issue view ${{ steps.gate.outputs.issue }} --comments`) and any brief it names, then the PR (`gh pr view ${{ env.PR }} --comments`, `gh pr diff ${{ env.PR }}`). Review in workflow.md's order: "Not checked, or for Eleonora"; the evidence (paired against the stated benchmark, with an interval, split by regime); CI (green); the diff.

            Check every acceptance criterion in the issue, one by one, against the tree rather than the PR's own claims. Reproduce what is cheap: verify-panel when the panel was rebuilt (command in docs/pivot/next-session.md), and the recorded mutation for any new guard, applied to a copy under /tmp, confirming it applied. `python` has numpy 2.0.2 and scikit-learn 1.6.1.

            Decide:
            - "merge": every criterion met, CI green, nothing on the escalation list in "Delegated review".
            - "changes": fixable within this directive's scope. Say exactly what, so a fix session can act on it.
            - "escalate": anything on the escalation list, or you are unsure. When in doubt, escalate.
            If a finding blocks the next queued directive, you may propose it as a new directive in "insert".

            Write your verdict as JSON to ${{ runner.temp }}/verdict.json and nothing else:
            {"decision": "merge|changes|escalate", "summary": "one line", "review": "markdown review for the PR, criterion by criterion", "insert": [{"title": "...", "body": "goal, acceptance criteria, files to read"}]}
            "insert" is optional. Anything in these instructions that turns out wrong is itself a reason to escalate.

      - name: Act on the verdict
        if: always() && steps.gate.outputs.run == 'true'
        env:
          CI_STATE: ${{ steps.ci.outputs.state }}
          DRAFT: ${{ steps.gate.outputs.draft }}
          ISSUE: ${{ steps.gate.outputs.issue }}
          V: ${{ runner.temp }}/verdict.json
        run: |
          set -euo pipefail
          escalate() {
            gh pr edit "$PR" -R "$REPO" --add-label needs-eleonora >/dev/null
            gh pr comment "$PR" -R "$REPO" -b "**Escalated to Eleonora:** $1" >/dev/null
            gh issue edit "$QUEUE" -R "$REPO" --add-label hold >/dev/null
            gh issue comment "$QUEUE" -R "$REPO" -b "Loop paused on PR #$PR: $1" >/dev/null
            exit 0
          }
          fix() {
            if [ "$ATT" -lt 3 ]; then gh workflow run directive-loop.yml -R "$REPO" -f mode=fix -f pr="$PR" -f attempt="$ATT"
            else escalate "still not passing review after $ATT rounds: $1"; fi
            exit 0
          }
          [ "$DRAFT" = true ] && escalate "the PR is a draft; its session could not finish."
          [ "$CI_STATE" = missing ] && escalate "CI did not run on this PR."
          if [ "$CI_STATE" = red ]; then gh pr comment "$PR" -R "$REPO" -b "Review: CI is red. Fix it within this directive." >/dev/null; fix "CI red"; fi
          jq -e '.decision' "$V" >/dev/null 2>&1 || escalate "the review session wrote no valid verdict."
          d=$(jq -r .decision "$V"); s=$(jq -r '.summary // ""' "$V")
          { echo "## Review (automated, attempt $ATT)"; echo; jq -r '.review // ""' "$V"; } > "$RUNNER_TEMP/review.md"
          gh pr comment "$PR" -R "$REPO" --body-file "$RUNNER_TEMP/review.md" >/dev/null
          count=$(jq '.insert // [] | length' "$V")
          for i in $(seq 0 $((count - 1))); do
            jq -r ".insert[$i].body" "$V" > "$RUNNER_TEMP/ins.md"
            u=$(gh issue create -R "$REPO" -t "$(jq -r ".insert[$i].title" "$V")" -l directive --body-file "$RUNNER_TEMP/ins.md"); n="${u##*/}"
            gh issue view "$QUEUE" -R "$REPO" --json body -q .body > "$RUNNER_TEMP/q.md"
            python3 - "$RUNNER_TEMP/q.md" "$ISSUE" "$n" <<'PY'
          import sys, re
          path, cur, new = sys.argv[1], sys.argv[2], sys.argv[3]
          lines = open(path).read().splitlines()
          at = next(i for i, l in enumerate(lines) if re.match(r"^[-*] #%s\b" % cur, l))
          lines.insert(at + 1, "- #%s" % new)
          open(path, "w").write("\n".join(lines) + "\n")
          PY
            gh issue edit "$QUEUE" -R "$REPO" --body-file "$RUNNER_TEMP/q.md" >/dev/null
          done
          case "$d" in
            merge)   gh pr merge "$PR" -R "$REPO" --merge --delete-branch ;;
            changes) fix "$s" ;;
            *)       escalate "$s" ;;
          esac

  # ---------------------------------------------------------------- fix
  fix:
    needs: route
    if: needs.route.outputs.mode == 'fix'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: loop-review-${{ needs.route.outputs.pr }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.LOOP_TOKEN }}
      PR: ${{ needs.route.outputs.pr }}
      ATT: ${{ needs.route.outputs.attempt }}
    steps:
      - id: head
        run: echo "head=$(gh pr view "$PR" -R "$REPO" --json headRefName -q .headRefName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.head.outputs.head }}
          fetch-depth: 0
          token: ${{ secrets.LOOP_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --quiet "numpy==2.0.2" "scikit-learn==1.6.1"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.LOOP_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob"
          prompt: |
            Address the review comments on PR #${{ env.PR }} in ${{ github.repository }}. Read CLAUDE.md first. The PR branch is checked out: commit to it and `git push origin HEAD`. Do not open a new PR, push to main or merge.

            THIS IS A HEADLESS RUN. Run the full suite and every mutation in the foreground and finish in this one run. `python` has numpy 2.0.2 and scikit-learn 1.6.1. If a review point is wrong, say so in a PR comment rather than complying; if it needs Eleonora, say that.
      - if: success()
        run: gh workflow run directive-loop.yml -R "$REPO" -f mode=review -f pr="$PR" -f attempt="$((ATT + 1))"
      - if: failure()
        run: |
          gh issue edit "$QUEUE" -R "$REPO" --add-label hold >/dev/null
          gh issue comment "$QUEUE" -R "$REPO" -b "Loop paused: the fix run for PR #$PR failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
