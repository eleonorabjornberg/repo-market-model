name: tests

on:
  pull_request:
    branches: [main, improvements]
  push:
    branches: [main, improvements]
  # Weekly run on main, so a change in the runner image or a dependency surfaces
  # between one merge and the next Monday.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

# A superseded push (force-push, rapid follow-up commit) makes the in-progress
# run worthless; stop it instead of stacking up to four ~12-minute jobs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: unit tests (3.11)
    runs-on: ubuntu-latest
    # The suite takes about 20 minutes; a hung run is stopped well after that.
    timeout-minutes: 60
    # 3.11 only, the one declared interpreter (requires-python, #53). 3.9 and
    # 3.10 left the matrix on the human's ruling of 30 Sep (#29): every
    # environment that runs this project is the rmm cloud environment, on 3.11.
    steps:
      # The whole history, not a depth-1 clone: the results page and
      # docs/status.json are stamped with the latest commit that changed an
      # input, and the commit-stamp test skips on a shallow clone (#268).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # No install step, deliberately: this job is the proof that the core
      # reproduces with no install. The ml extra has its own job below. If this
      # job ever needs a `pip install`, that is a dependency decision for the
      # human, not a CI fix.
      #
      # -B and PYTHONDONTWRITEBYTECODE=1 because a stale __pycache__ has already
      # produced one false mutation result on this project. CPython's mtime+size
      # check does not notice an edit that preserves byte length.
      #
      # Note: unittest exits non-zero on an *unexpected success* as well as on a
      # failure. That is intended: the suite carries zero expectedFailure, and a
      # placeholder that starts passing is a red build until it is replaced
      # with the real test.
      - name: Run the suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python3 -B -m unittest discover -s tests -v

      # The results page is generated, never hand-edited; this refuses a stale
      # one (the same check tests/test_visual.py makes, run as the command a
      # contributor runs). Needs the history, hence fetch-depth above.
      - name: Check the results page is current
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python3 -B scripts/emit_visual.py --check

  ml:
    # The optional ml extra (AGENT_CONTRACT.md, working rules; 10 Sep), with
    # REPO_MODEL_REQUIRE_ML=1 so tests/test_ml.py fails rather than skips if
    # the extra did not install: the core job above cannot see those tests,
    # and a skip nothing can see is not a test. 3.11, the interpreter the rmm
    # environment scores on (#29). The install pins exactly the versions the
    # rmm environment's /opt/rmm-venv is to pin (#55), so CI and the environment
    # fit with the same numpy and scikit-learn; pyproject.toml's bounds admit
    # them.
    #
    # On a pull request, the modules whose tests change with the extra
    # installed, and nothing else: test_ml.py, test_tail_diagnostics.py (which
    # imports test_ml) and test_cli_eval.py (whose gbm cases skip without the
    # extra). Every other module runs identically with or without it and is
    # proven by the core job above in the same run. The two conformance-
    # coverage checks in test_baseline and test_contract import the modules
    # that define conformance cases themselves (#29), so they no longer need
    # this job to load test_ml beside them. Pushes and the weekly schedule run
    # the whole suite here too, so a merge is never under-tested on the way in.
    name: unit tests with the ml extra (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole history, not a depth-1 clone: the results page and
      # docs/status.json are stamped with the latest commit that changed an
      # input, and the commit-stamp test skips on a shallow clone (#268).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          # Key the wheel cache on the file that pins the versions, so a bump
          # of the ml extra's bounds invalidates it.
          cache-dependency-path: pyproject.toml

      - name: Install the ml extra
        run: python3 -m pip install ".[ml]" "numpy==2.4.6" "scikit-learn==1.9.1"

      - name: Run the suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
          REPO_MODEL_REQUIRE_ML: "1"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Subtests marked `skip_if_fast` in test_ml (refit sweeps, never a
            # leakage, availability or staleness guard) skip here and run on
            # every push and on the schedule (directive 05, Do 4).
            REPO_MODEL_SKIP_SLOW=1 PYTHONPATH=src:tests python3 -B -m unittest test_ml test_tail_diagnostics test_cli_eval -v
          else
            python3 -B -m unittest discover -s tests -v
          fi

  owner-attested:
    # A binding change (a lockbox tier, the live pin, a model joining the live
    # record) counts only with Eleonora's own GitHub comment, not one posted
    # through an app (#256; draft rule docs/decisions/drafts/owner-attestation.md).
    # The pull request cites it in metadata/owner_attestations.json, and this
    # job fetches it. With no binding change and no new citation it fetches
    # nothing.
    name: owner attestation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Binding changes cite an owner-attested comment
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/owner_attested.py check --base "$BASE_SHA"
