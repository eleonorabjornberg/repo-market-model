name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    name: unit tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Every interpreter the declaration admits, and both of the two the tracks
    # actually run. This job was pinned to a single "3.12" until 10 Sep, on
    # which the suite runs all 700 tests and fails exactly one -- the guard that
    # enforces requires-python = ">=3.9,<3.11" -- so the badge at the top of
    # README.md was red for a version the project does not claim to support,
    # and no CI run had ever exercised 3.9 at all. A matrix is also the honest
    # answer to "should both tracks run the same interpreter": measured on
    # 7b8f0c9, 3.9.23 and 3.10.20 are green and identical, so parity by decree
    # was never the check -- this is.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      # No install step: the project is stdlib-only by contract. If this job
      # ever needs a `pip install`, that is a dependency decision for the human,
      # not a CI fix.
      #
      # -B and PYTHONDONTWRITEBYTECODE=1 because a stale __pycache__ has already
      # produced one false mutation result on this project. CPython's mtime+size
      # check does not notice an edit that preserves byte length.
      #
      # Note: unittest exits non-zero on an *unexpected success* as well as on a
      # failure. That is intended. TargetSchemaTests contains an expectedFailure
      # placeholder for the fitted-model interface Track B has not built; when
      # that interface lands, this job goes red until the same pull request
      # replaces the placeholder with behavioral conformance tests.
      - name: Run the suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python3 -B -m unittest discover -s tests -v

  ownership:
    name: contract ownership
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the check diffs against the merge base, which a
          # shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the track ownership split
        run: |
          python3 .github/check_ownership.py \
            "origin/${{ github.base_ref }}" \
            "${{ github.head_ref }}"
