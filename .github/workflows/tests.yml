name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Nightly run on main, so a change in the runner image or a dependency surfaces
  # between one merge and the next day, and so the classes marked nightly run
  # here even on a day with no merge (#869).
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

# A superseded push (force-push, rapid follow-up commit) makes the in-progress
# run worthless; stop it instead of stacking up jobs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# On a pull request the classes declared in tests/nightly.py (the slowest ones,
# #858) skip with their reason printed. A push to main and the nightly schedule
# leave REPO_MODEL_SKIP_NIGHTLY empty, so the whole suite runs there and a
# failure turns main red (#869).
env:
  REPO_MODEL_SKIP_NIGHTLY: ${{ github.event_name == 'pull_request' && '1' || '' }}

jobs:
  suite-shard:
    # The suite as parallel shards (#927): `scripts/ci_shards.py` gives each shard its test modules,
    # every module in exactly one shard, the long walk-forward and simulation modules spread over
    # shards of their own. `python3 -B -m unittest discover -s tests` still runs everything in one
    # process for a local run; the shards are how CI finishes in minutes instead of one long job.
    name: "unit tests: suite shard ${{ matrix.shard }} (3.11)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    # 3.11 only, the one declared interpreter (requires-python, #53). 3.9 and
    # 3.10 left the matrix on the human's ruling of 30 Sep (#29): every
    # environment that runs this project is the rmm cloud environment, on 3.11.
    steps:
      # The whole history, not a depth-1 clone: the results page and
      # docs/status.json are stamped with the latest commit that changed an
      # input, and the commit-stamp test skips on a shallow clone (#268).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # No install step, deliberately: this job is the proof that the core
      # reproduces with no install. The ml extra has its own job below. If this
      # job ever needs a `pip install`, that is a dependency decision for the
      # human, not a CI fix.
      #
      # -B and PYTHONDONTWRITEBYTECODE=1 because a stale __pycache__ has already
      # produced one false mutation result on this project. CPython's mtime+size
      # check does not notice an edit that preserves byte length.
      #
      # Note: unittest exits non-zero on an *unexpected success* as well as on a
      # failure. That is intended: the suite carries zero expectedFailure, and a
      # placeholder that starts passing is a red build until it is replaced
      # with the real test.
      - name: Run this shard's test modules
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:tests
        run: python3 -B -m unittest $(python3 scripts/ci_shards.py modules --shard ${{ matrix.shard }}) -v

  pages:
    # The generated pages are current. Run once, not per shard. Both need the history.
    name: "unit tests: generated pages current"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # The results page is built on main and never committed (#928); this
      # builds it from the tree, which refuses a page the inputs cannot produce,
      # and refuses a tracked copy.
      - name: Check the results page builds and is not committed
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: python3 -B scripts/emit_visual.py --check

      # The progress page and its data are generated from the committed
      # evidence (#637); this refuses a stale one.
      - name: Check the progress page is current
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/emit_progress.py --check

      # Every test module is in exactly one shard (#927).
      - name: Check every test module is in a shard
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/ci_shards.py check

  suite:
    # The one required check for the suite.
    # It keeps the name the ruleset requires, and it succeeds only when every job it needs
    # succeeded; a cancelled or skipped shard fails it (#927).
    name: "unit tests: suite (3.11)"
    if: ${{ always() }}
    needs: [suite-shard, pages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this one waits for succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          [ -n "$RESULTS" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  offline-shard:
    # The same suite again with the network namespace empty, so a test that
    # reaches a host fails here by name even if the in-process guard
    # (tests/netguard.py) were bypassed (#262), in the same shards as `suite-shard` (#927).
    # `sudo` for the namespace; the environment and PATH are passed through so it is this job's python.
    name: "unit tests: networking off shard ${{ matrix.shard }} (3.11)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Run this shard with networking disabled
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:tests
        run: sudo --preserve-env=PYTHONDONTWRITEBYTECODE,PYTHONPATH,REPO_MODEL_SKIP_NIGHTLY env "PATH=$PATH" unshare --net python3 -B -m unittest $(python3 scripts/ci_shards.py modules --shard ${{ matrix.shard }})

  offline:
    # The required check for the networking-off pass.
    # It keeps the name the ruleset requires, and it succeeds only when every job it needs
    # succeeded; a cancelled or skipped shard fails it (#927).
    name: "unit tests: networking off (3.11)"
    if: ${{ always() }}
    needs: [offline-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this one waits for succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          [ -n "$RESULTS" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  ml-shard:
    # The optional ml extra (AGENT_CONTRACT.md, working rules; 10 Sep), with
    # REPO_MODEL_REQUIRE_ML=1 so tests/test_ml.py fails rather than skips if
    # the extra did not install: the core job above cannot see those tests,
    # and a skip nothing can see is not a test. 3.11, the interpreter the rmm
    # environment scores on (#29). The install pins exactly the versions the
    # rmm environment's /opt/rmm-venv is to pin (#55), so CI and the environment
    # fit with the same numpy and scikit-learn; pyproject.toml's bounds admit
    # them.
    #
    # On a pull request, the modules whose tests change with the extra
    # installed, and nothing else: test_ml.py, test_tail_diagnostics.py (which
    # imports test_ml) and test_cli_eval.py (whose gbm cases skip without the
    # extra). Every other module runs identically with or without it and is
    # proven by the core job above in the same run. The two conformance-
    # coverage checks in test_baseline and test_contract import the modules
    # that define conformance cases themselves (#29), so they no longer need
    # this job to load test_ml beside them. Pushes and the nightly schedule run
    # the whole suite here too, in the same shards as `suite-shard` (#927), so a
    # merge is never under-tested on the way in.
    name: "unit tests: ml extra shard ${{ matrix.shard }} (3.11)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[1, 2, 3, 4, 5, 6]') }}
    steps:
      # The whole history, not a depth-1 clone: the results page and
      # docs/status.json are stamped with the latest commit that changed an
      # input, and the commit-stamp test skips on a shallow clone (#268).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          # Key the wheel cache on the file that pins the versions, so a bump
          # of the ml extra's bounds invalidates it.
          cache-dependency-path: pyproject.toml

      - name: Install the ml extra
        run: python3 -m pip install ".[ml]" "numpy==2.4.6" "scikit-learn==1.9.1"

      - name: Run the suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:tests
          REPO_MODEL_REQUIRE_ML: "1"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Subtests marked `skip_if_fast` in test_ml (refit sweeps, never a
            # leakage, availability or staleness guard) skip here and run on
            # every push and on the schedule (directive 05, Do 4).
            REPO_MODEL_SKIP_SLOW=1 python3 -B -m unittest test_ml test_tail_diagnostics test_cli_eval -v
          else
            python3 -B -m unittest $(python3 scripts/ci_shards.py modules --shard ${{ matrix.shard }}) -v
          fi

  ml:
    # The required check for the ml extra.
    # It keeps the name the ruleset requires, and it succeeds only when every job it needs
    # succeeded; a cancelled or skipped shard fails it (#927).
    name: "unit tests: ml extra (3.11)"
    if: ${{ always() }}
    needs: [ml-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job this one waits for succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          [ -n "$RESULTS" ] || exit 1
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done

  research-log:
    # The research log (#638): `docs/research/log/` (one file per entry, #866) keeps to its format and to the hypotheses of
    # `docs/research/plan.md`, and a pull request that changes a result page or a declaration adds an entry that
    # names its directive (the `Closes #N` line of its body).
    name: research log
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      # `log.md` is generated from the entry files under `docs/research/log/` (#866) and built on main, never
      # committed (#928); this refuses a tracked copy.
      - name: Check the log page is not committed
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/check_research_log.py assemble --check

      - name: The log is well formed
        if: github.event_name != 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/check_research_log.py check

      - name: The log is well formed and names this pull request's directive
        if: github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/check_research_log.py check --base "$BASE_SHA"

      # The page, its data and the assembled log are built on main (#928). A pull request that carries one fails
      # here with a message that says to change the inputs instead.
      - name: No built output is committed
        if: github.event_name != 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/check_built_outputs.py

      - name: No built output is committed or changed by this pull request
        if: github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/check_built_outputs.py --base "$BASE_SHA"

  owner-attested:
    # A binding change (a lockbox tier, the live pin, a model joining the live
    # record, CLAUDE.md or .claude/, a registration record) counts only with Eleonora's own GitHub comment, not one posted
    # through an app (#256; draft rule docs/decisions/drafts/owner-attestation.md).
    # The pull request cites it in metadata/owner_attestations.json, and this
    # job fetches it. With no binding change and no new citation it fetches
    # nothing.
    name: owner attestation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Binding changes cite an owner-attested comment
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/owner_attested.py check --base "$BASE_SHA"
